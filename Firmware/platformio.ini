[platformio]
; JillTrak firmware. The default build is the transmitter as fitted to the
; tx-kick board: `pio run` builds it, `pio run -t upload` flashes it.
default_envs = attiny85_kick

; ATtiny85, programmed through an Uno running ArduinoISP (tools/arduinoisp).
; Bare metal, no Arduino core.
;   pio run -e attiny85 -t fuses    set the fuses, once per chip
;   pio run -e attiny85 -t upload   flash the firmware
[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 4000000L        ; RC 8 MHz / 2: rated down to 1.8 V
build_src_filter = +<attiny85/>
upload_protocol = stk500v1
upload_port = /dev/ttyACM0   ; the Uno running ArduinoISP; /dev/serial/by-id/... is steadier if you have several boards
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
board_fuses.lfuse = 0x62             ; 8 MHz RC, starts divided to 1 MHz
board_fuses.hfuse = 0xDE             ; brown-out at 1.8 V (boards 2 and 3: 0xE2 / 0xDD, 2.7 V)
board_fuses.efuse = 0xFF

; Bring-up test: toggles pin 6 every 250 ms and does nothing else, to prove the
; chip is programmed, clocked and running.
;   pio run -e attiny85_blink -t upload
[env:attiny85_blink]
extends = env:attiny85
build_flags = -DBRINGUP_BLINK=1

; Diagnostic: reports the reset cause as a pulse count on pin 6 at every start,
; then blinks with the tank pins undriven.
;   pio run -e attiny85_why -t upload
[env:attiny85_why]
extends = env:attiny85
build_flags = -DRESET_CAUSE_PROBE=1

; Transistor test drive: PB4 kicks an NPN at the carrier, 25 % on by default.
; Sweep the pulse width with e.g. build_flags = -DDRIVE_KICK=1 -DKICK_MATCH=42
[env:attiny85_kick]
extends = env:attiny85
build_flags = -DDRIVE_KICK=1

; Comparison builds for the bench, kick drive as above. 8 MHz CPU, polling
; through the burst as on boards 2 and 3, to measure what idle and 4 MHz save:
;   pio run -e attiny85_kick_8mhz -t upload
[env:attiny85_kick_8mhz]
extends = env:attiny85_kick
board_build.f_cpu = 8000000L
build_flags = -DDRIVE_KICK=1 -DBURST_IDLE=0
